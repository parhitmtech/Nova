name: Deploy
# Continuous deployment: when "Build and test" passes on main, build the server and worker images,
# push them to GitHub Container Registry and roll them out to the EC2 host. Can also be started
# manually (Actions > Deploy > Run workflow). One-time setup: docs/DEPLOY.md.
on:
  workflow_run:
    workflows: ['Build and test']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt a rollout halfway

env:
  REGISTRY: ghcr.io/parhitmtech

jobs:
  images:
    name: Build and push images
    # Only after CI succeeded for a push to main (or a manual run).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # the exact commit CI tested
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: tag
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          push: true
          tags: |
            ${{ env.REGISTRY }}/nova-worker:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/nova-worker:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
      - name: Server image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: server
          push: true
          tags: |
            ${{ env.REGISTRY }}/nova-server:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/nova-server:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

  deploy:
    name: Deploy to EC2
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Settings > Environments > production: holds the EC2 secrets and can require an approval.
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy deployment files
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            deploy/compose.prod.yml deploy/deploy.sh "$TARGET:/opt/novacomp/"
      - name: Roll out ${{ needs.images.outputs.tag }}
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
          TAG: ${{ needs.images.outputs.tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh_host() { ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$TARGET" "$@"; }
          # Short-lived registry login so the host can pull this run's images.
          printf '%s' "$GHCR_TOKEN" | ssh_host "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh_host "bash /opt/novacomp/deploy.sh '$TAG'"
