name: Build and test
on: [push, pull_request, merge_group]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: No tracked files that .gitignore excludes
        run: |
          tracked="$(git ls-files -ci --exclude-standard)"
          if [ -n "$tracked" ]; then
            echo "::error::These tracked files match .gitignore (build output, secrets or scratch files). Run 'git rm --cached' on them:"
            echo "$tracked"
            exit 1
          fi
      # The runner's preinstalled Node is enough: the script uses only built-ins.
      - name: No tracked secrets, dependencies, runtime data or binaries
        run: node scripts/check-repo-hygiene.js
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks dir . --redact --no-banner

  backend:
    name: Backend unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Some execution tests stream from the real compiler binary.
      - run: npm run build:compiler
      - run: npm run test:unit

  compiler:
    name: Compiler (${{ matrix.cxx }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Build
        run: make CXX="$CXX" CXXFLAGS="$CXXFLAGS"
        env:
          CXX: ${{ matrix.cxx }}
          CXXFLAGS: -O2 -Wall -Wextra -Werror  # keep the build warning-free
      - name: Language tests (tests/*.nova)
        run: node tests/run.js
      - name: Language tests with --optimize
        run: node tests/run.js
        env:
          NOVA_TEST_ARGS: --optimize

  sanitizers:
    name: Compiler (ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Build with sanitizers
        run: make CXX="$CXX" CXXFLAGS="$CXXFLAGS"
        env:
          CXX: clang++
          CXXFLAGS: -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined
      - name: Language tests under sanitizers
        run: node tests/run.js
        env:
          # The parser never frees its IR, so leak reports are noise for now.
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1

  # The front end runs on every keystroke in an editor, so no input may crash it: libFuzzer feeds it changed
  # versions of the golden tests and the standard library, under ASan and UBSan, for two minutes per pull request.
  fuzz:
    name: Fuzz the front end
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: compiler/fuzz
    steps:
      - uses: actions/checkout@v7
      - name: Build the fuzz target
        run: make CXX=clang++
      - name: The inputs that once failed
        run: make regress CXX=clang++
      - name: Fuzz for two minutes
        run: make run SECONDS=120 CXX=clang++
      - name: Upload the input that failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failure
          path: |
            compiler/fuzz/crash-*
            compiler/fuzz/timeout-*
            compiler/fuzz/oom-*
          retention-days: 14

  # nova-lsp, the language server VS Code runs: its protocol tests drive the real binary over stdio, then again
  # built with ASan and UBSan (a leak or an invalid access fails the run, since the server's exit status is tested)
  lsp:
    name: Language server
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Build nova-lsp
        run: make lsp
      - name: Protocol tests
        run: make lsp-test
      - name: Protocol tests under ASan and UBSan
        run: |
          make lsp BUILD=build/asan CXX=clang++ CXXFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined"
          node lsp/test/run.js build/asan/nova-lsp

  mlir:
    name: MLIR dialect (nova-opt + lit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # LLVM/MLIR 20 from apt.llvm.org, the same packages as the local WSL build; clang links the binaries the
      # test/Run tests compile and run
      - name: Install LLVM and MLIR 20
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" | sudo tee /etc/apt/sources.list.d/llvm-20.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-20-dev llvm-20-tools libmlir-20-dev mlir-20-tools clang-20 ninja-build
          pipx install lit  # the runner's Python is externally managed (PEP 668), so not pip
      - name: Configure
        run: >-
          cmake -G Ninja -S compiler/mlir -B build/mlir
          -DMLIR_DIR=/usr/lib/llvm-20/lib/cmake/mlir
          -DLLVM_EXTERNAL_LIT="$(command -v lit)"  # pipx's bin dir differs by machine
      - name: Build nova-opt and run the dialect tests
        run: ninja -C build/mlir check-nova

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test  # Vitest unit tests
      - run: npm run build

  vscode:
    name: VS Code extension
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: editors/vscode/nova
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: editors/vscode/nova/package-lock.json
      - run: npm ci
      # The extension ships its own copy of the license; it must stay the repository's
      - run: cmp LICENSE ../../../LICENSE
      - name: Type-check
        run: npm run typecheck
      - name: The grammar's scopes (test/grammar)
        run: npm run test:grammar
      # The integration tests run the extension in VS Code, which starts the language server and runs the compiler
      - name: Build nova and nova-lsp
        working-directory: compiler
        run: make -j4 && make lsp
      - name: Build the extension
        run: npm run build
      - name: In VS Code 1.91, the oldest the extension supports
        run: xvfb-run -a npm run test:extension
      - name: In the latest VS Code
        run: xvfb-run -a npm run test:extension
        env:
          VSCODE_VERSION: stable
      # vsce validates the manifest (publisher, icon, engines, links) as the Marketplace will
      - run: npm run package
      - name: Package holds exactly the expected files
        run: |
          unzip -Z1 nova-*.vsix | sort > files.txt
          cat files.txt
          for f in extension/package.json extension/LICENSE.txt extension/icon.png extension/readme.md \
                   extension/changelog.md extension/language-configuration.json extension/dist/extension.js \
                   extension/syntaxes/nova.tmLanguage.json extension/snippets/nova.json; do
            grep -qx "$f" files.txt || { echo "::error::$f is missing from the package"; exit 1; }
          done
          if grep -qE 'node_modules|/src/|/test/|\.ts$|\.map$' files.txt; then
            echo "::error::sources, tests or dependencies leaked into the package"; exit 1
          fi

  # The packages people install, one per platform (.github/workflows/package.yml, which releases use too)
  vscode-packages:
    name: VS Code packages
    uses: ./.github/workflows/package.yml

  e2e:
    name: Frontend e2e (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  docker:
    name: Docker images
    needs: [backend, compiler]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: docker build --target worker -t novacomp-worker:local .
      - name: Worker smoke test
        run: npm run test:worker
        working-directory: server
      - run: docker build --target server -t novacomp-server:ci .
