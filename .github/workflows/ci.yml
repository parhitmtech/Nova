name: Build and test
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: No tracked files that .gitignore excludes
        run: |
          tracked="$(git ls-files -ci --exclude-standard)"
          if [ -n "$tracked" ]; then
            echo "::error::These tracked files match .gitignore (build output, secrets or scratch files). Run 'git rm --cached' on them:"
            echo "$tracked"
            exit 1
          fi
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks dir . --redact --no-banner

  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Compiler_PJ_3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: Compiler_PJ_3/package-lock.json
      - run: npm ci
      - run: npm run test:security

  compiler:
    name: Compiler (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    defaults:
      run:
        working-directory: Compiler_PJ_3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Build
        run: node scripts/build-compiler.js
        env:
          CXX: ${{ matrix.cxx }}
          CXXFLAGS: -O2 -Wall -Wextra
      - name: Language tests (tests/*.nova)
        run: node run_tests.js

  sanitizers:
    name: Compiler (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Report-only until the memory errors it finds are fixed; then make it blocking.
    continue-on-error: true
    defaults:
      run:
        working-directory: Compiler_PJ_3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Build with sanitizers
        run: node scripts/build-compiler.js
        env:
          CXX: clang++
          CXXFLAGS: -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined
      - name: Language tests under sanitizers
        run: node run_tests.js
        env:
          # The parser never frees its IR, so leak reports are noise for now.
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: novacomp-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: novacomp-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Frontend e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: novacomp-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: novacomp-frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            novacomp-frontend/playwright-report/
            novacomp-frontend/test-results/
          retention-days: 7

  docker:
    name: Docker images
    needs: [backend, compiler]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: docker build --target worker -t novacomp-worker:local .
      - name: Worker smoke test
        run: npm run test:worker
        working-directory: Compiler_PJ_3
      - run: docker build --target server -t novacomp-server:ci .
