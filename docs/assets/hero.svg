<text x="640" y="116" class="mono" font-size="14" xml:space="preserve"><tspan fill="#99a6be"></tspan><tspan fill="#a5a2ff">ignite</tspan><tspan fill="#e6eaf2">:</tspan></text>
<text x="640" y="140" class="mono" font-size="14" xml:space="preserve"><tspan fill="#99a6be">    </tspan><tspan fill="#76dac4">Linear</tspan><tspan fill="#e6eaf2"> layer = Linear(2, 4)</tspan></text>
<text x="640" y="164" class="mono" font-size="14" xml:space="preserve"><tspan fill="#99a6be">    </tspan><tspan fill="#76dac4">Tensor</tspan><tspan fill="#e6eaf2"> h = relu(layer.forward(X))</tspan></text>
<text x="640" y="188" class="mono" font-size="14" xml:space="preserve"><tspan fill="#99a6be">    </tspan><tspan fill="#e6eaf2">backward(mse_loss(h</tspan><tspan fill="#e6eaf2"> @ W, Y))</tspan></text>
