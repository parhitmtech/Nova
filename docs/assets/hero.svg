<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #e6eaf2; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
  .muted { fill: #99a6be; }
  .title { font-size: 20px; font-weight: 700; }
  .sub { font-size: 13px; fill: #99a6be; }
  .lbl { font-size: 13px; }
  .val { font-size: 12px; font-weight: 600; }
  .tick { font-size: 11px; fill: #99a6be; }
  .grid { stroke: #242e43; stroke-width: 1; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .word { font-size: 64px; font-weight: 800; letter-spacing: -1.5px; }
  .tag { font-size: 19px; fill: #99a6be; }
  .stage { font-size: 13px; font-weight: 600; }
  .pulse { animation: flow 4.2s linear infinite; }
  @keyframes flow { 0% { offset-distance: 0%; opacity: 0; } 6% { opacity: 1; }
                     94% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
  .glow { animation: glow 4.2s ease-in-out infinite; }
  @keyframes glow { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
  .caret { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .typed { animation: type 3.2s steps(34) 0.4s both; }
  @keyframes type { from { width: 0; } to { width: 330px; } }
</style>
<rect x="0.5" y="0.5" width="1199" height="359" rx="14" fill="#0c101b" stroke="#242e43"/>
<defs><radialGradient id="g1" cx="0.15" cy="0.2" r="0.6"><stop offset="0" stop-color="#a5a2ff" stop-opacity=".22"/><stop offset="1" stop-color="#a5a2ff" stop-opacity="0"/></radialGradient><radialGradient id="g2" cx="0.9" cy="0.9" r="0.6"><stop offset="0" stop-color="#76dac4" stop-opacity=".16"/><stop offset="1" stop-color="#76dac4" stop-opacity="0"/></radialGradient><linearGradient id="wm" x1="0" x2="1"><stop offset="0" stop-color="#a5a2ff"/><stop offset="1" stop-color="#76dac4"/></linearGradient><clipPath id="typeclip"><rect class="typed" x="640" y="70" width="330" height="30"/></clipPath></defs>
<rect x="1" y="1" width="1198" height="358" rx="14" fill="url(#g1)"/>
<rect x="1" y="1" width="1198" height="358" rx="14" fill="url(#g2)"/>
<text x="56" y="112" class="word" fill="url(#wm)" style="fill:url(#wm)">Nova</text>
<text x="58" y="148" class="tag">A statically typed language for machine learning,</text>
<text x="58" y="174" class="tag">and NovaComp, the cloud IDE that runs it.</text>
