<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #e6eaf2; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
  .muted { fill: #99a6be; }
  .title { font-size: 20px; font-weight: 700; }
  .sub { font-size: 13px; fill: #99a6be; }
  .lbl { font-size: 13px; }
  .val { font-size: 12px; font-weight: 600; }
  .tick { font-size: 11px; fill: #99a6be; }
  .grid { stroke: #242e43; stroke-width: 1; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .col { transform-box: fill-box; transform-origin: center bottom; animation: rise 1s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  .fade { animation: fade .5s ease-out both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .dash { stroke-dasharray: 6 5; }
</style>
<rect x="0.5" y="0.5" width="999" height="429" rx="14" fill="#0c101b" stroke="#242e43"/>
<text x="32" y="44" class="title">GPU: a 4096³ matmul, written four ways by hand, then in Triton</text>
<text x="32" y="68" class="sub">Share of cuBLAS's FP32 speed (19.0 TFLOP/s) on SOL's NVIDIA A100. Every kernel's result matches cuBLAS.</text>
<line x1="70" y1="330.0" x2="960" y2="330.0" class="grid"/><text x="60" y="334.0" class="tick" text-anchor="end">0%</text>
<line x1="70" y1="275.0" x2="960" y2="275.0" class="grid"/><text x="60" y="279.0" class="tick" text-anchor="end">25%</text>
<line x1="70" y1="220.0" x2="960" y2="220.0" class="grid"/><text x="60" y="224.0" class="tick" text-anchor="end">50%</text>
<line x1="70" y1="165.0" x2="960" y2="165.0" class="grid"/><text x="60" y="169.0" class="tick" text-anchor="end">75%</text>
<line x1="70" y1="110.0" x2="960" y2="110.0" class="grid"/><text x="60" y="114.0" class="tick" text-anchor="end">100%</text>
<line x1="70" y1="110.0" x2="960" y2="110.0" stroke="#f2c879" class="dash"/><text x="956" y="102.0" class="tick" text-anchor="end" style="fill:#f2c879">cuBLAS</text>
<rect class="col" style="animation-delay:0.00s" x="113.5" y="301.4" width="87.0" height="28.6" rx="6" fill="#99a6be" opacity=".92"/>
<text class="fade" style="animation-delay:0.80s" x="157.0" y="291.4" text-anchor="middle" font-size="18" font-weight="700">13%</text>
<text x="157.0" y="354" class="lbl" text-anchor="middle" font-weight="600">naive</text><text x="157.0" y="372" class="tick" text-anchor="middle">one thread per element</text>
<rect class="col" style="animation-delay:0.18s" x="287.5" y="270.6" width="87.0" height="59.4" rx="6" fill="#7cb8f2" opacity=".92"/>
<text class="fade" style="animation-delay:0.98s" x="331.0" y="260.6" text-anchor="middle" font-size="18" font-weight="700">27%</text>
<text x="331.0" y="354" class="lbl" text-anchor="middle" font-weight="600">tiled</text><text x="331.0" y="372" class="tick" text-anchor="middle">32×32 shared-memory tiles</text>
<rect class="col" style="animation-delay:0.36s" x="461.5" y="220.0" width="87.0" height="110.0" rx="6" fill="#76dac4" opacity=".92"/>
<text class="fade" style="animation-delay:1.16s" x="505.0" y="210.0" text-anchor="middle" font-size="18" font-weight="700">50%</text>
<text x="505.0" y="354" class="lbl" text-anchor="middle" font-weight="600">blocked</text><text x="505.0" y="372" class="tick" text-anchor="middle">4×4 register blocking</text>
<rect class="col" style="animation-delay:0.54s" x="635.5" y="149.6" width="87.0" height="180.4" rx="6" fill="#a5a2ff" opacity=".92"/>
<text class="fade" style="animation-delay:1.34s" x="679.0" y="139.6" text-anchor="middle" font-size="18" font-weight="700">82%</text>
<text x="679.0" y="354" class="lbl" text-anchor="middle" font-weight="600">pipelined</text><text x="679.0" y="372" class="tick" text-anchor="middle">cp.async double buffering</text>
<rect class="col" style="animation-delay:0.72s" x="809.5" y="121.0" width="87.0" height="209.0" rx="6" fill="#f5a6b1" opacity=".92"/>
<text class="fade" style="animation-delay:1.52s" x="853.0" y="111.0" text-anchor="middle" font-size="18" font-weight="700">95%</text>
<text x="853.0" y="354" class="lbl" text-anchor="middle" font-weight="600">Triton FP32</text><text x="853.0" y="372" class="tick" text-anchor="middle">autotuned, 4 stages</text>
</svg>
