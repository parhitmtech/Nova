<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #e6eaf2; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
  .muted { fill: #99a6be; }
  .title { font-size: 20px; font-weight: 700; }
  .sub { font-size: 13px; fill: #99a6be; }
  .lbl { font-size: 13px; }
  .val { font-size: 12px; font-weight: 600; }
  .tick { font-size: 11px; fill: #99a6be; }
  .grid { stroke: #242e43; stroke-width: 1; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .col { transform-box: fill-box; transform-origin: center bottom; animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  .dash { stroke-dasharray: 6 5; }
</style>
<rect x="0.5" y="0.5" width="999" height="439" rx="14" fill="#0c101b" stroke="#242e43"/>
<text x="32" y="44" class="title">GPU: the same matmul across sizes, CUDA by hand against Triton</text>
<text x="32" y="68" class="sub">Share of cuBLAS on an A100 (FP32 against FP32, TF32 against TF32). Above 100% beats cuBLAS.</text>
<rect x="32" y="84" width="12" height="12" rx="3" fill="#a5a2ff"/><text x="50" y="95" class="tick" style="fill:#e6eaf2">pipelined CUDA (FP32)</text>
<rect x="215.0" y="84" width="12" height="12" rx="3" fill="#f5a6b1"/><text x="233.0" y="95" class="tick" style="fill:#e6eaf2">Triton FP32</text>
<rect x="328.0" y="84" width="12" height="12" rx="3" fill="#76dac4"/><text x="346.0" y="95" class="tick" style="fill:#e6eaf2">Triton TF32, tensor cores</text>
<line x1="70" y1="330.0" x2="970" y2="330.0" class="grid"/><text x="60" y="334.0" class="tick" text-anchor="end">0%</text>
