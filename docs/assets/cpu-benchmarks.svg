<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #e6eaf2; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
  .muted { fill: #99a6be; }
  .title { font-size: 20px; font-weight: 700; }
  .sub { font-size: 13px; fill: #99a6be; }
  .lbl { font-size: 13px; }
  .val { font-size: 12px; font-weight: 600; }
  .tick { font-size: 11px; fill: #99a6be; }
  .grid { stroke: #242e43; stroke-width: 1; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .fade { animation: fade .6s ease-out both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
</style>
<rect x="0.5" y="0.5" width="999" height="499" rx="14" fill="#0c101b" stroke="#242e43"/>
<text x="32" y="44" class="title">CPU: Nova's interpreter next to CPython, Node and C</text>
<text x="32" y="68" class="sub">Wall-clock ms, best of 7, including process startup (log scale, shorter is faster). Intel Core Ultra 7 155H.</text>
<rect x="32" y="82" width="12" height="12" rx="3" fill="#a5a2ff"/><text x="50" y="93" class="tick" style="fill:#e6eaf2">Nova</text>
<rect x="91.6" y="82" width="12" height="12" rx="3" fill="#f2c879"/><text x="109.6" y="93" class="tick" style="fill:#e6eaf2">CPython 3.13</text>
<rect x="210.4" y="82" width="12" height="12" rx="3" fill="#76dac4"/><text x="228.4" y="93" class="tick" style="fill:#e6eaf2">Node 22</text>
<rect x="292.20000000000005" y="82" width="12" height="12" rx="3" fill="#7cb8f2"/><text x="310.20000000000005" y="93" class="tick" style="fill:#e6eaf2">C -O2</text>
<line x1="210.0" y1="100" x2="210.0" y2="427" class="grid"/><text x="210.0" y="445" class="tick" text-anchor="middle">10 ms</text>
<line x1="359.3" y1="100" x2="359.3" y2="427" class="grid"/><text x="359.3" y="445" class="tick" text-anchor="middle">30 ms</text>
<line x1="522.9" y1="100" x2="522.9" y2="427" class="grid"/><text x="522.9" y="445" class="tick" text-anchor="middle">100 ms</text>
<line x1="672.2" y1="100" x2="672.2" y2="427" class="grid"/><text x="672.2" y="445" class="tick" text-anchor="middle">300 ms</text>
<line x1="835.8" y1="100" x2="835.8" y2="427" class="grid"/><text x="835.8" y="445" class="tick" text-anchor="middle">1,000 ms</text>
<text x="194" y="149.5" class="lbl mono" text-anchor="end" font-weight="600">calls</text><text x="194" y="166.5" class="tick" text-anchor="end">naive fib(30), 2.7M calls</text>
<rect class="bar" style="animation-delay:0.00s" x="210" y="108" width="626.3" height="18" rx="4" fill="#a5a2ff"/>
<text class="val fade" style="animation-delay:0.70s" x="844.3" y="121">1,004 ms</text>
<rect class="bar" style="animation-delay:0.06s" x="210" y="131" width="352.7" height="18" rx="4" fill="#f2c879"/>
<text class="val fade" style="animation-delay:0.76s" x="570.7" y="144">134 ms</text>
<rect class="bar" style="animation-delay:0.12s" x="210" y="154" width="234.1" height="18" rx="4" fill="#76dac4"/>
<text class="val fade" style="animation-delay:0.82s" x="452.1" y="167">56 ms</text>
<rect class="bar" style="animation-delay:0.18s" x="210" y="177" width="72.1" height="18" rx="4" fill="#7cb8f2"/>
<text class="val fade" style="animation-delay:0.88s" x="290.1" y="190">17 ms</text>
<text x="194" y="262.5" class="lbl mono" text-anchor="end" font-weight="600">int_loop</text><text x="194" y="279.5" class="tick" text-anchor="end">3M-iteration integer loop</text>
<rect class="bar" style="animation-delay:0.24s" x="210" y="221" width="352.7" height="18" rx="4" fill="#a5a2ff"/>
<text class="val fade" style="animation-delay:0.94s" x="570.7" y="234">134 ms  ⚠ wrong answer (32-bit int overflow)</text>
<rect class="bar" style="animation-delay:0.30s" x="210" y="244" width="527.8" height="18" rx="4" fill="#f2c879"/>
<text class="val fade" style="animation-delay:1.00s" x="745.8" y="257">486 ms</text>
<rect class="bar" style="animation-delay:0.36s" x="210" y="267" width="229.2" height="18" rx="4" fill="#76dac4"/>
<text class="val fade" style="animation-delay:1.06s" x="447.2" y="280">54 ms</text>
<rect class="bar" style="animation-delay:0.42s" x="210" y="290" width="72.1" height="18" rx="4" fill="#7cb8f2"/>
<text class="val fade" style="animation-delay:1.12s" x="290.1" y="303">17 ms</text>
<text x="194" y="375.5" class="lbl mono" text-anchor="end" font-weight="600">vector_sum</text><text x="194" y="392.5" class="tick" text-anchor="end">fill and sum a 1M vector</text>
<rect class="bar" style="animation-delay:0.48s" x="210" y="334" width="303.0" height="18" rx="4" fill="#a5a2ff"/>
<text class="val fade" style="animation-delay:1.18s" x="521.0" y="347">93 ms</text>
<rect class="bar" style="animation-delay:0.54s" x="210" y="357" width="401.5" height="18" rx="4" fill="#f2c879"/>
<text class="val fade" style="animation-delay:1.24s" x="619.5" y="370">192 ms</text>
<rect class="bar" style="animation-delay:0.60s" x="210" y="380" width="252.3" height="18" rx="4" fill="#76dac4"/>
<text class="val fade" style="animation-delay:1.30s" x="470.3" y="393">64 ms</text>
<rect class="bar" style="animation-delay:0.66s" x="210" y="403" width="72.1" height="18" rx="4" fill="#7cb8f2"/>
<text class="val fade" style="animation-delay:1.36s" x="290.1" y="416">17 ms</text>
<text x="32" y="478" class="sub">2–3.5× faster than CPython on loops and vectors; about 7.5× slower on function calls (per-call frame copies, see docs/BENCHMARKS.md).</text>
</svg>
